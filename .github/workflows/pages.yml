name: Publish VERBA experimental demo
on:
  workflow_dispatch:
    inputs:
      rights_confirmed:
        description: Public use of the VERBA photo/video assets is confirmed for this demo
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verba-experimental-pages
  cancel-in-progress: false
jobs:
  static-check:
    if: github.ref == 'refs/heads/experiment/verba-motion' && inputs.rights_confirmed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static files
        run: |
          python3 scripts/check_static.py
          node --check app.js
          python3 scripts/export_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: static-check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the experimental static artifact
        id: deployment
        uses: actions/deploy-pages@v4
